# Lean, self-contained tmux config for remote hosts.
#
# Deploy: scp / rsync this file to the remote and drop it at ~/.tmux.conf
# (or source it from there). No plugins, no external scripts — just enough
# to feel like home on a box where you can't clone the full dotfiles.
#
# Why a separate prefix from local (C-a)?
# You always know which tmux layer you're in — the outer (local) tmux keeps
# C-a, this remote tmux uses C-s. No collisions, no F12 toggle, no SSH
# detection. The red status bar is a second visual guard.


### Prefix
# use C-s on remote; local tmux keeps C-a
unbind C-a
unbind C-b
set -g prefix C-s
bind -r C-s send-prefix


### Basics
set -ga terminal-overrides ",screen-256color*:Tc"
set -g default-terminal "screen-256color"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 65536
set -g buffer-limit 20
set -g repeat-time 300
set -sg escape-time 0
set -g renumber-windows on
set -g detach-on-destroy off
set -g focus-events on
setw -g aggressive-resize on
setw -g mode-keys vi
set -g status-keys emacs
set -g display-time 850
set -g display-panes-time 1250


### Keybindings
# reload
bind r source-file ~/.tmux.conf \; display-message "remote tmux.conf reloaded!"

# new window in cwd
bind c new-window -c '#{pane_current_path}'

# splits (match local)
bind "\\" split-window -h -c "#{pane_current_path}"
bind "%" split-window -h -c "#{pane_current_path}"
bind "-" split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# pane nav (plain vi, no vim-tmux-navigator on remote)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 5

# window nav
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# last-window & last-session
bind \; last-window
unbind Space
bind Space switch-client -l

# session picker
bind s choose-tree -Zs -O time

# copy mode (vi)
bind -T copy-mode-vi "v" send-keys -X begin-selection
bind -T copy-mode-vi "V" send-keys -X rectangle-toggle
bind -T copy-mode-vi "y" send-keys -X copy-selection-and-cancel

# kill shortcuts
bind x kill-pane
bind X confirm -p "Confirm 'kill-session #S'? (y/n)" kill-session


### Visual distinction: red = you're on a remote host
# status bar
set -g status-style bg=colour52,fg=colour230
set -g status-left-length 40
set -g status-left '#[bg=colour124,fg=colour230,bold]  #H #[bg=colour52] #S '
set -g status-right '#[fg=colour230]%H:%M '

# window list
setw -g window-status-style fg=colour230
setw -g window-status-current-style bg=colour160,fg=colour230,bold
setw -g window-status-separator '  '

# borders & messages
set -g pane-border-style fg=colour52
set -g pane-active-border-style fg=colour160
set -g message-style bg=colour230,fg=colour124
