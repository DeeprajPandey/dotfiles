- defaults:
    link:
      create: true
      relink: true
- clean:
    ~/:
      force: true
    ~/.config:
      recursive: true
- clean: ['~/.ssh']
- link:
    ~/.dotfiles: ''
    ~/.config:
    ~/.gnupg/common.conf:
      path: gnupg/common.conf
    ~/.gnupg/gpg.conf:
      path: gnupg/gpg.conf
    ~/.gnupg/gpg-agent.conf:
      path: gnupg/gpg-agent.conf
    ~/.shell:
    ~/.ssh/config: ssh/config
    ~/.vim:
    ~/.zshrc:
    ~/.zprofile:
      force: true
- create:
    # - ~/.rtorrent/downloads
    # - ~/.rtorrent/session
    # - ~/.rtorrent/watch
    - ~/.vim/undo-history
- create:
    ~/.ssh:
      mode: 0700
- shell:
    - ["git submodule update --init --recursive", "Installing submodules"]
    - git submodule sync --recursive
    # the following have to run after linking ~/.gitconfig
    - git update-submodules
  # - >
  #   git cleanall -f
  #   vim/pack/vendor/start/
  #   zsh/plugins/
